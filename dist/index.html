<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071818">
  <title>Wildbound Character Viewer</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span>WILDBOUND <small>CHARACTER VIEWER</small></span></div>
      <span id="roster-count" class="roster-count">Loading units…</span>
    </header>
    <section class="stage-layout" aria-label="Character preview">
      <div class="stage-wrap">
        <div class="stage-label"><span>RIG PREVIEW</span><span id="facing-label">FRONT</span></div>
        <canvas id="stage" width="960" height="560" aria-label="Selected Wildbound character animation"></canvas>
        <div class="stage-bottom"><span id="frame-label">FRAME 01</span><span>SELECT A UNIT BELOW</span></div>
      </div>
      <aside class="control-panel">
        <p class="eyebrow">SELECTED UNIT <span id="position-label">01 / 01</span></p>
        <h1 id="unit-name">Loading…</h1>
        <p id="unit-kind" class="unit-kind"></p>
        <label class="field" for="animation-select">Animation</label>
        <select id="animation-select" aria-label="Animation"></select>
        <button id="play-button" class="play-button" type="button" aria-pressed="true">Stop animation</button>
        <label class="switch-row"><span><strong>Loop</strong><small>Repeat the selected animation</small></span><input id="loop-toggle" type="checkbox" checked><span class="switch" aria-hidden="true"></span></label>
        <label class="switch-row"><span><strong>Spin rig</strong><small>Rotate through all eight facings</small></span><input id="spin-toggle" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
        <p id="status" class="status" role="status"></p>
      </aside>
    </section>
    <section class="roster-section" aria-label="Unit carousel">
      <div class="roster-heading"><h2>Units</h2><div class="carousel-actions"><button id="previous" type="button" aria-label="Previous unit">‹</button><button id="next" type="button" aria-label="Next unit">›</button></div></div>
      <div id="carousel" class="carousel" role="listbox" aria-label="Select a unit"></div>
    </section>
  </main>
  <script type="module" src="./viewer.mjs"></script>
</body>
</html>
