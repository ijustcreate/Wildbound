<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wildbound | Character Generation 2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172b29;color:#e4eee7;font:15px system-ui,sans-serif;letter-spacing:0}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:25px;color:#efdba8}h2{font-size:18px;margin-top:32px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}label{display:grid;gap:6px}select,button,input{font:inherit}select,button{background:#2d453f;color:#f3eddc;border:1px solid #819588;padding:8px}button{min-width:44px;cursor:pointer}input{max-width:160px}a{color:#a5e2db}nav{display:flex;gap:20px;flex-wrap:wrap;margin:22px 0}.angles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #40574e}.angle{text-align:center;min-width:0}.angle canvas{image-rendering:pixelated;width:100%;aspect-ratio:1;display:block}.angle span{display:block;color:#b7cbbd}.sheet{width:100%;height:auto;image-rendering:pixelated;display:block}summary{cursor:pointer;padding:16px 0}details{border-top:1px solid #40574e}output{min-width:80px}@media(max-width:650px){main{padding:12px}.angles{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:22px}}
</style>
<main>
<h1>Wildbound / Character Generation 2</h1>
<header>
<label>Rig<select id="variant"></select></label>
<label>Animation<select id="action"></select></label>
<button id="play" title="Pause animation" aria-label="Pause animation">&#10074;&#10074;</button>
<label>Frame<input id="frame" type="range" min="0" value="0" step="1"></label><output id="counter"></output>
</header>
<nav><a id="native">Native Sprite Sheet</a><a id="contact">Contact Sheet</a><a href="manifest.json">Manifest</a><a href="rig-snapshot.json">Rig Snapshot</a></nav>
<section class="angles" id="angles" aria-label="Eight animated views"></section>
<h2>Generation Comparison</h2>
<details><summary>Before / Base Rig</summary><img class="sheet" id="before" alt="Previous character generation, all eight directions"></details>
<details><summary>After / Selected Rig</summary><img class="sheet" id="after" alt="New character generation, all eight directions"></details>
<h2>Appearance Studies</h2>
<details><summary>Every Hairstyle / Eight Directions</summary><img class="sheet" src="all-hairstyles.png" alt="All seven hairstyles from eight angles" loading="lazy"></details>
<details><summary>Face Styles / Skin Tones / Builds</summary><img class="sheet" src="face-variants.png" alt="Face styles and skin tones" loading="lazy"></details>
<h2>Equipment Catalog</h2><section id="catalogs"></section>
</main>
<script>
const manifest={"variants":[{"id":"hair-none","appearance":{"skin":"#d9ab76","shirt":"#bb8c35","pants":"#655039","shoes":"#49372d","hair":"none","hairColor":"#593923"},"equipment":{}},{"id":"base","appearance":{"skin":"#d9ab76","shirt":"#bb8c35","pants":"#655039","shoes":"#49372d","hair":"crop","hairColor":"#593923"},"equipment":{}},{"id":"hair-bob","appearance":{"skin":"#d9ab76","shirt":"#bb8c35","pants":"#655039","shoes":"#49372d","hair":"bob","hairColor":"#593923"},"equipment":{}},{"id":"hair-long","appearance":{"skin":"#d9ab76","shirt":"#bb8c35","pants":"#655039","shoes":"#49372d","hair":"long","hairColor":"#593923"},"equipment":{}},{"id":"hair-ponytail","appearance":{"skin":"#d9ab76","shirt":"#bb8c35","pants":"#655039","shoes":"#49372d","hair":"ponytail","hairColor":"#593923"},"equipment":{}},{"id":"hair-mohawk","appearance":{"skin":"#d9ab76","shirt":"#bb8c35","pants":"#655039","shoes":"#49372d","hair":"mohawk","hairColor":"#593923"},"equipment":{}},{"id":"hair-curls","appearance":{"skin":"#d9ab76","shirt":"#bb8c35","pants":"#655039","shoes":"#49372d","hair":"curls","hairColor":"#593923"},"equipment":{}},{"id":"sword-shield","equipment":{"hand1":"iron_sword","hand2":"moon_shield","feet":"moon_steps","shoulders":"moon_shoulders"}},{"id":"archer","equipment":{"hand1":"moon_bow","chest":"armor","feet":"boots","gloves":"gloves"}},{"id":"safari","equipment":{"head":"safari_hat","shoulders":"safari_shoulders","chest":"safari_vest","gloves":"safari_gloves","pants":"safari_pants","feet":"safari_boots","hand1":"rifle"}},{"id":"mage","equipment":{"head":"moon_circlet","hand1":"storm_wand","cape":"night_cape"}}],"animations":[{"action":"idle","frames":8,"fps":8,"loop":true},{"action":"run","frames":8,"fps":12,"loop":true},{"action":"punch","frames":6,"fps":18,"loop":false},{"action":"slash","frames":6,"fps":18,"loop":false},{"action":"draw","frames":8,"fps":12,"loop":false},{"action":"hurt","frames":4,"fps":12,"loop":false},{"action":"dash","frames":4,"fps":12,"loop":true},{"action":"block","frames":4,"fps":8,"loop":true},{"action":"walk","frames":8,"fps":7,"loop":true},{"action":"swipe_one","frames":7,"fps":16,"loop":false},{"action":"swipe_two","frames":7,"fps":16,"loop":false},{"action":"swipe_big","frames":10,"fps":16,"loop":false},{"action":"punch_left","frames":6,"fps":16,"loop":false},{"action":"punch_right","frames":6,"fps":16,"loop":false},{"action":"uppercut","frames":6,"fps":16,"loop":false},{"action":"cast","frames":7,"fps":16,"loop":false},{"action":"jump_takeoff","frames":4,"fps":16,"loop":false},{"action":"jump_air","frames":4,"fps":16,"loop":true},{"action":"jump_fall","frames":4,"fps":16,"loop":true},{"action":"land","frames":5,"fps":16,"loop":false},{"action":"interact","frames":8,"fps":16,"loop":false},{"action":"get_up","frames":8,"fps":16,"loop":false},{"action":"revive","frames":8,"fps":16,"loop":false},{"action":"swim","frames":12,"fps":16,"loop":true},{"action":"death","frames":8,"fps":16,"loop":false},{"action":"sleep","frames":2,"fps":4,"loop":true},{"action":"salvage","frames":12,"fps":16,"loop":false},{"action":"pickup","frames":9,"fps":16,"loop":false},{"action":"carry","frames":8,"fps":16,"loop":true},{"action":"found_unique","frames":10,"fps":16,"loop":false},{"action":"mine","frames":10,"fps":16,"loop":false},{"action":"woodcut","frames":10,"fps":16,"loop":false},{"action":"shield","frames":4,"fps":16,"loop":true},{"action":"parry","frames":6,"fps":16,"loop":false},{"action":"ranged","frames":7,"fps":16,"loop":false},{"action":"sword_combo","frames":8,"fps":16,"loop":false}],"directions":["S","SW","W","NW","N","NE","E","SE"],"catalogPages":4,"cell":{"width":128,"height":128,"anchorX":64,"anchorY":88},"generation":2,"source":"authored/rigs.json + src/player-motion.mjs"};
const variant=document.getElementById('variant'),action=document.getElementById('action'),slider=document.getElementById('frame');
for(const v of manifest.variants)variant.add(new Option(v.id,v.id));variant.value='base';
for(const a of manifest.animations)action.add(new Option(a.action,a.action));
const views=manifest.directions.map(label=>{const box=document.createElement('div');box.className='angle';const text=document.createElement('span');text.textContent=label;const canvas=document.createElement('canvas');canvas.width=128;canvas.height=128;box.append(text,canvas);document.getElementById('angles').append(box);return canvas.getContext('2d');});
for(let p=1;p<=manifest.catalogPages;p++){const details=document.createElement('details'),summary=document.createElement('summary'),img=document.createElement('img');summary.textContent='Catalog '+p;img.src='gear-catalog-'+p+'.png';img.alt='Equipment catalog '+p;img.loading='lazy';img.className='sheet';details.append(summary,img);document.getElementById('catalogs').append(details);}
let sprite=new Image(),playing=true,start=performance.now(),frame=0,clip;
function fitSprite(image){const buffer=document.createElement('canvas');buffer.width=image.width;buffer.height=image.height;const c=buffer.getContext('2d');c.drawImage(image,0,0);const pixels=c.getImageData(0,0,image.width,image.height).data;let left=128,top=128,right=0,bottom=0;for(let y=0;y<image.height;y++)for(let x=0;x<image.width;x++)if(pixels[(y*image.width+x)*4+3]){left=Math.min(left,x%128);right=Math.max(right,x%128);top=Math.min(top,y%128);bottom=Math.max(bottom,y%128);}const size=Math.min(128,Math.max(right-left,bottom-top)+13);image.crop={x:Math.max(0,Math.min(128-size,Math.floor((left+right-size)/2))),y:Math.max(0,Math.min(128-size,Math.floor((top+bottom-size)/2))),size};}
function change(){clip=manifest.animations.find(a=>a.action===action.value);slider.max=clip.frames-1;frame=0;slider.value=0;start=performance.now();sprite=new Image();sprite.onload=function(){fitSprite(this);};sprite.src='native/'+variant.value+'/'+action.value+'.png';document.getElementById('native').href=sprite.src;const contact='after/'+variant.value+'/player-'+action.value+'-8dir.png';document.getElementById('contact').href=contact;document.getElementById('after').src=contact;document.getElementById('before').src='before/player-'+action.value+'-8dir.png';}
variant.onchange=action.onchange=change;
const play=document.getElementById('play');
function toggle(value){playing=value;play.innerHTML=playing?'&#10074;&#10074;':'&#9654;';play.title=playing?'Pause animation':'Play animation';play.setAttribute('aria-label',play.title);start=performance.now()-frame/clip.fps*1000;}
play.onclick=()=>toggle(!playing);slider.oninput=()=>{frame=Number(slider.value);toggle(false);};
function tick(now){if(playing){frame=Math.floor((now-start)*clip.fps/1000)%clip.frames;slider.value=frame;}views.forEach((c,d)=>{c.clearRect(0,0,128,128);c.imageSmoothingEnabled=false;if(sprite.complete&&sprite.naturalWidth&&sprite.crop){const r=sprite.crop;c.drawImage(sprite,frame*128+r.x,d*128+r.y,r.size,r.size,0,0,128,128);}});document.getElementById('counter').textContent=(frame+1)+' / '+clip.frames;requestAnimationFrame(tick);}
change();requestAnimationFrame(tick);
</script>
</html>
